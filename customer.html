<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cày Thuê - Khách hàng</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#222;
}

.box{
  width:min(440px,92%);
  margin:30px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 8px 30px #0001;
}

h1{text-align:center}

h3{
  margin-top:0;
}

input,button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border-radius:9px;
  border:1px solid #ddd;
  font-size:15px;
}

button{
  border:0;
  background:#111827;
  color:#fff;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.hidden{
  display:none;
}

.wallet{
  background:#eef2ff;
  padding:18px;
  border-radius:12px;
  margin:15px 0;
}

.balance{
  font-size:28px;
  font-weight:bold;
  margin-top:6px;
}

.card{
  background:#f8fafc;
  padding:16px;
  border-radius:12px;
  margin-top:15px;
}

.msg{
  margin-top:12px;
  font-size:14px;
  color:#d00;
}

.success{
  color:#15803d;
}

.switch{
  background:none;
  color:#2563eb;
  margin-top:8px;
}

.deposit{
  background:#16a34a;
}

.logout{
  background:#dc2626;
}

.item{
  padding:10px 0;
  border-bottom:1px solid #eee;
  font-size:14px;
}

.label{
  display:block;
  margin-top:12px;
  font-size:14px;
  font-weight:bold;
}

.bank-info{
  background:#ecfdf5;
  border:1px solid #bbf7d0;
  padding:14px;
  border-radius:10px;
  margin-bottom:15px;
}

.bank-info b{
  display:block;
  margin-top:4px;
  font-size:18px;
}
</style>
</head>

<body>

<div class="box">

<!-- ================= ĐĂNG NHẬP ================= -->

<section id="loginBox">

<h1>Đăng nhập</h1>

<input
  id="loginEmail"
  type="email"
  placeholder="Email"
>

<input
  id="loginPassword"
  type="password"
  placeholder="Mật khẩu"
>

<button id="loginBtn">
Đăng nhập
</button>

<button
  class="switch"
  id="showRegister">
Chưa có tài khoản? Đăng ký
</button>

<div id="loginMsg" class="msg"></div>

</section>


<!-- ================= ĐĂNG KÝ ================= -->

<section
  id="registerBox"
  class="hidden">

<h1>Đăng ký</h1>

<input
  id="registerName"
  type="text"
  placeholder="Họ tên"
>

<input
  id="registerEmail"
  type="email"
  placeholder="Email"
>

<input
  id="registerPassword"
  type="password"
  placeholder="Mật khẩu"
>

<button id="registerBtn">
Tạo tài khoản
</button>

<button
  class="switch"
  id="showLogin">
Đã có tài khoản? Đăng nhập
</button>

<div id="registerMsg" class="msg"></div>

</section>


<!-- ================= TÀI KHOẢN ================= -->

<section
  id="accountBox"
  class="hidden">

<h1>Tài khoản</h1>

<p>Email:</p>

<b id="userEmail"></b>


<!-- ================= SỐ DƯ ================= -->

<div class="wallet">

<div>Số dư</div>

<div
  class="balance"
  id="balance">
0đ
</div>

</div>


<!-- ================= NẠP TIỀN ================= -->

<div class="card">

<h3>💰 Nạp tiền</h3>


<!-- TÀI KHOẢN NHẬN TIỀN -->

<div class="bank-info">

<div>
🏦 Ngân hàng nhận tiền
</div>

<b>
VietinBank
</b>


<div style="margin-top:10px">
Số tài khoản
</div>

<b>
0942180769
</b>

</div>


<!-- SỐ TIỀN -->

<label class="label">
Số tiền muốn nạp
</label>

<input
  id="depositAmount"
  type="number"
  min="1000"
  placeholder="Ví dụ: 50000"
>


<!-- TÊN KHÁCH -->

<label class="label">
Tên tài khoản khách hàng
</label>

<input
  id="customerAccountName"
  type="text"
  placeholder="Nhập tên tài khoản của bạn"
>


<!-- MÃ GIAO DỊCH -->

<label class="label">
Mã giao dịch / nội dung chuyển khoản
</label>

<input
  id="transferCode"
  type="text"
  placeholder="Ví dụ: NAP123456"
>


<button
  class="deposit"
  id="depositBtn">
Gửi yêu cầu nạp tiền
</button>

<div
  id="depositMsg"
  class="msg">
</div>

</div>


<!-- ================= LỊCH SỬ NẠP ================= -->

<div class="card">

<h3>📋 Lịch sử nạp tiền</h3>

<div id="depositList">
Chưa có giao dịch
</div>

</div>


<!-- ================= ĐĂNG XUẤT ================= -->

<button
  class="logout"
  id="logoutBtn">
Đăng xuất
</button>

</section>

</div>


<script src="config.js"></script>

<script>

const sb = supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_KEY
);

const $ = id =>
  document.getElementById(id);


/* ================= ĐỊNH DẠNG TIỀN ================= */

function money(n){

  return new Intl.NumberFormat("vi-VN")
    .format(n || 0) + "đ";

}


/* ================= CHUYỂN TRANG ================= */

function showLogin(){

  $("loginBox").classList.remove("hidden");

  $("registerBox").classList.add("hidden");

  $("accountBox").classList.add("hidden");

}


function showRegister(){

  $("loginBox").classList.add("hidden");

  $("registerBox").classList.remove("hidden");

  $("accountBox").classList.add("hidden");

}


function showAccount(){

  $("loginBox").classList.add("hidden");

  $("registerBox").classList.add("hidden");

  $("accountBox").classList.remove("hidden");

}


$("showRegister").onclick =
  showRegister;


$("showLogin").onclick =
  showLogin;


/* ================= ĐĂNG KÝ ================= */

$("registerBtn").onclick =
async () => {

  $("registerMsg").textContent =
    "Đang tạo tài khoản...";

  $("registerMsg").classList.remove("success");


  const name =
    $("registerName")
      .value
      .trim();


  const email =
    $("registerEmail")
      .value
      .trim();


  const password =
    $("registerPassword")
      .value;


  if(!name || !email || !password){

    $("registerMsg").textContent =
      "Vui lòng nhập đầy đủ thông tin.";

    return;

  }


  if(password.length < 6){

    $("registerMsg").textContent =
      "Mật khẩu phải có ít nhất 6 ký tự.";

    return;

  }


  const {
    data,
    error
  } =
    await sb.auth.signUp({

      email,
      password

    });


  if(error){

    $("registerMsg").textContent =
      error.message;

    return;

  }


  if(data.user){

    const {
      error:profileError
    } =
      await sb
        .from("profiles")
        .update({

          full_name:name,
          email:email

        })
        .eq(
          "id",
          data.user.id
        );


    if(profileError){

      console.error(
        profileError
      );

    }

  }


  $("registerMsg").textContent =
    "Đăng ký thành công. Bạn có thể đăng nhập.";

  $("registerMsg")
    .classList.add("success");


  setTimeout(
    showLogin,
    1000
  );

};


/* ================= ĐĂNG NHẬP ================= */

$("loginBtn").onclick =
async () => {

  $("loginMsg").textContent =
    "Đang đăng nhập...";


  const email =
    $("loginEmail")
      .value
      .trim();


  const password =
    $("loginPassword")
      .value;


  const {
    data,
    error
  } =
    await sb.auth.signInWithPassword({

      email,
      password

    });


  if(error){

    $("loginMsg").textContent =
      error.message;

    return;

  }


  await loadAccount(
    data.user
  );

};


/* ================= TẢI TÀI KHOẢN ================= */

async function loadAccount(user){

  showAccount();


  $("userEmail").textContent =
    user.email;


  const {
    data,
    error
  } =
    await sb
      .from("wallets")
      .select("balance")
      .eq(
        "user_id",
        user.id
      )
      .single();


  if(error){

    $("balance").textContent =
      "0đ";

  }else{

    $("balance").textContent =
      money(data.balance);

  }


  loadDeposits(user);

}


/* ================= GỬI YÊU CẦU NẠP ================= */

$("depositBtn").onclick =
async () => {

  const msg =
    $("depositMsg");


  msg.textContent =
    "Đang gửi yêu cầu...";


  msg.classList.remove(
    "success"
  );


  const amount =
    Number(
      $("depositAmount").value
    );


  const customerAccountName =
    $("customerAccountName")
      .value
      .trim();


  const transferCode =
    $("transferCode")
      .value
      .trim();


  if(!amount || amount < 1000){

    msg.textContent =
      "Số tiền tối thiểu là 1.000đ.";

    return;

  }


  if(!customerAccountName){

    msg.textContent =
      "Vui lòng nhập tên tài khoản khách hàng.";

    return;

  }


  if(!transferCode){

    msg.textContent =
      "Vui lòng nhập mã giao dịch hoặc nội dung chuyển khoản.";

    return;

  }


  const {
    data:{
      user
    }
  } =
    await sb.auth.getUser();


  if(!user){

    msg.textContent =
      "Phiên đăng nhập đã hết.";

    return;

  }


  /*
    Tài khoản nhận tiền cố định:
    VietinBank - 0942180769
  */

  const note =
    "Ngân hàng: VietinBank" +
    " | STK nhận tiền: 0942180769" +
    " | Tên tài khoản khách: " +
    customerAccountName;


  const {
    error
  } =
    await sb
      .from("deposit_requests")
      .insert({

        user_id:user.id,

        amount:amount,

        transfer_code:transferCode,

        note:note

      });


  if(error){

    msg.textContent =
      error.message;

    return;

  }


  msg.textContent =
    "Đã gửi yêu cầu. Chờ Admin duyệt.";

  msg.classList.add(
    "success"
  );


  $("depositAmount").value =
    "";

  $("customerAccountName").value =
    "";

  $("transferCode").value =
    "";


  loadDeposits(user);

};


/* ================= LỊCH SỬ NẠP ================= */

async function loadDeposits(user){

  const {
    data,
    error
  } =
    await sb
      .from("deposit_requests")
      .select("*")
      .eq(
        "user_id",
        user.id
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    $("depositList").textContent =
      "Không tải được lịch sử.";

    return;

  }


  if(!data || !data.length){

    $("depositList").textContent =
      "Chưa có giao dịch.";

    return;

  }


  $("depositList").innerHTML =
    data.map(x => {

      let status =
        x.status === "approved"
        ? "✅ Đã duyệt"
        : x.status === "rejected"
        ? "❌ Từ chối"
        : "⏳ Chờ duyệt";


      return `

        <div class="item">

          <b>
            ${money(x.amount)}
          </b>

          <br>

          ${status}

          <br>

          <small>
            ${new Date(
              x.created_at
            ).toLocaleString("vi-VN")}
          </small>

          <br>

          <small>
            Mã giao dịch:
            ${x.transfer_code || "—"}
          </small>

        </div>

      `;

    }).join("");

}


/* ================= ĐĂNG XUẤT ================= */

$("logoutBtn").onclick =
async () => {

  await sb.auth.signOut();

  showLogin();

};


/* ================= KIỂM TRA SESSION ================= */

sb.auth.onAuthStateChange(
  (event,session) => {

    if(session){

      loadAccount(
        session.user
      );

    }else{

      showLogin();

    }

  }
);

</script>

</body>
</html>
